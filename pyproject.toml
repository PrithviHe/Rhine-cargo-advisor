[project]
name = "ds-modeling-pipeline"
version = "0.1.0"
description = "Coffee quality modeling pipeline with MLflow tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "mlflow",
    "parsenvy",
    "joblib>=1.6.0",
    "altair>=6.3.0",
    "streamlit>=1.64.0",
    "lightgbm>=4.7.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "testbook",
    "black",
    "nbdime",
]

[tool.uv]
package = false
