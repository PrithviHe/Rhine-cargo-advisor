[project]
name = "hydroload-ai"
version = "0.1.0"
description = "7-day Rhine water-level forecast at Kaub and barge cargo planning (Streamlit app)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "joblib>=1.6.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "black",
    "nbdime",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# modeling/ is imported as a namespace package from the repo root, not installed
# (tool.uv package = false), so pytest needs the root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
