[project]
name = "ds-modeling-pipeline"
version = "0.1.0"
description = "Coffee quality modeling pipeline with MLflow tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "mlflow",
    "parsenvy",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "testbook",
    "black",
    "nbdime",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# modeling/ is imported as a namespace package from the repo root, not installed
# (tool.uv package = false), so pytest needs the root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
